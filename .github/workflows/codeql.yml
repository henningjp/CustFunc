# CodeQL analysis for CustFunc.
#
# CustFunc is a Windows DLL that links to PTC's Mathcad Prime header (MCADINCL.H) and import
# library (mcaduser.lib).  Those files are not part of this repository, so the build below
# fetches them at run time from the CoolProp repository, where they are published with PTC's
# permission for building Mathcad wrappers.  They are only used to compile and are never
# committed here or uploaded as build output.  Please see the README in that folder for the
# PTC terms of use.
#
# This build also acts as a compile check: if a change breaks the build, this workflow fails.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.xml'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.xml'
  workflow_dispatch:
#  schedule:
#    - cron: '25 23 * * 1'

env:
  # Commit of CoolProp/CoolProp that holds the Mathcad Prime header and library.
  # Pinned so a change in that repository cannot silently change this build.
  MATHCAD_LIBS_REPO: CoolProp/CoolProp
  MATHCAD_LIBS_REF: 022b63e4f73ce25757e1d696a81ffeeba230c261
  MATHCAD_LIBS_PATH: wrappers/MathCAD/Prime/libs
  # The Visual Studio project looks for the Mathcad files in this folder, so create it on the runner.
  MATHCAD_DIR: C:\Program Files\PTC\Mathcad Prime 12.0.0.0\Custom Functions

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch Mathcad Prime header and library
      uses: actions/checkout@v4
      with:
        repository: ${{ env.MATHCAD_LIBS_REPO }}
        ref: ${{ env.MATHCAD_LIBS_REF }}
        path: mathcad-libs
        sparse-checkout: ${{ env.MATHCAD_LIBS_PATH }}
        sparse-checkout-cone-mode: false

    - name: Stage Mathcad files where the project expects them
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path $env:MATHCAD_DIR | Out-Null
        Copy-Item "mathcad-libs/$env:MATHCAD_LIBS_PATH/MCADINCL.H" $env:MATHCAD_DIR
        Copy-Item "mathcad-libs/$env:MATHCAD_LIBS_PATH/mcaduser.lib" $env:MATHCAD_DIR
        Get-ChildItem $env:MATHCAD_DIR

    # Initializes the CodeQL tools for scanning.  Must run before the build.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build CustFunc (Release x64)
      shell: pwsh
      run: msbuild build/CustFunc.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
